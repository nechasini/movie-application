<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 Movie Application</h1>
        <p>Explore and manage your favourite movies</p>
    </header>

    <main>

        <!-- Add Movie -->
        <section class="form-section">

            <h2>Add a Movie</h2>

            <form id="movieForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Movie Title"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Release Year"
                    required
                >

                <input
                    type="text"
                    id="genre"
                    placeholder="Genre"
                    required
                >

                <input
                    type="number"
                    id="rating"
                    placeholder="Rating (0-10)"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <input
                    type="url"
                    id="image"
                    placeholder="Movie Image URL"
                    required
                >

                <button type="submit">
                    Add Movie
                </button>

            </form>

        </section>

        <!-- Search -->
        <section class="search-section">

            <h2>Movies</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >

            <button onclick="searchMovies()">
                Search
            </button>

            <button onclick="getMovies()">
                Show All
            </button>

        </section>

        <!-- Movie List -->
        <section>

            <div id="movieContainer"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
